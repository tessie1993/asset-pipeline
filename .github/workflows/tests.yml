name: Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  asset-pipeline:
    name: Run asset pipeline tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run asset pipeline tests
        run: python -W error::ResourceWarning -m unittest discover -s tests/tools/assetgen -p "*_test.py"
